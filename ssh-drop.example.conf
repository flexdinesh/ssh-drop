# Development example. Run from the repository root:
# go run ./cmd/ssh-drop --config ./ssh-drop.example.conf

# Local testing requires an SSH server running on this machine.
# SSH uses your current username and available keys/agent.
[remote.local]
host = 127.0.0.1
destination = /tmp/ssh-drop-dev/

# Replace with your remote hostname or an existing OpenSSH alias.
[remote.dev]
host = remote.example.com
user = deploy
# identity_file = ~/.ssh/id_ed25519
# port = 2222
destination = /tmp/ssh-drop-dev/
