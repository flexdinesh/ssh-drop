name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      SSH_DROP_REQUIRE_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install SSH integration prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server rsync
          sudo mkdir -p /run/sshd

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/ssh-drop

  snapshot:
    name: GoReleaser Snapshot
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dev:
    name: Publish Go dev channel
    runs-on: ubuntu-latest
    needs: [test, snapshot]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: release-dev
      cancel-in-progress: false
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Update dev branch
        shell: python
        run: |
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          commit = git("rev-parse", "HEAD")
          main = git("ls-remote", "origin", "refs/heads/main").split()[0]
          if commit != main:
              print("Skipping superseded main commit")
          else:
              # dev is an install channel; replace any obsolete development history.
              dev = git("ls-remote", "origin", "refs/heads/dev").split()
              previous = dev[0] if dev else ""
              git("push", f"--force-with-lease=refs/heads/dev:{previous}",
                  "origin", f"{commit}:refs/heads/dev")
