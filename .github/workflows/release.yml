name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SSH_DROP_REQUIRE_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install SSH integration prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server rsync
          sudo mkdir -p /run/sshd

      - name: Test
        run: go test ./...

      - name: Select release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          current="$(git tag --points-at HEAD -l 'v0.1.*' --sort=-v:refname | head -n 1)"
          if [[ -n "$current" ]]; then
            echo "tag=$current" >> "$GITHUB_OUTPUT"
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest="$(git tag -l 'v0.1.*' --sort=-v:refname | head -n 1)"
          if [[ -z "$latest" ]]; then
            next="v0.1.0"
          else
            patch="${latest##*.}"
            next="v0.1.$((patch + 1))"
          fi

          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "create=true" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        if: steps.tag.outputs.create == 'true'
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Temporary: GoReleaser skips cask upload (skip_upload) so the cask can be
      # patched before publishing. Once
      # https://github.com/goreleaser/goreleaser/pull/7253 ships, remove these
      # two steps and let GoReleaser publish again. See docs/release.md,
      # "Cask Zap Workaround".
      - name: Patch Homebrew cask
        run: scripts/patch-homebrew-cask.sh dist/homebrew/Casks/ssh-drop.rb

      - name: Publish Homebrew cask
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          tap="flexdinesh/homebrew-tap"
          branch="ssh-drop-${TAG}"
          message="Update ssh-drop to ${TAG}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${tap}.git" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse --verify --quiet "origin/${branch}" > /dev/null; then
            git switch --create "$branch" "origin/${branch}"
          else
            git switch --create "$branch" origin/main
          fi

          cp ../dist/homebrew/Casks/ssh-drop.rb Casks/ssh-drop.rb
          if ! git diff --quiet origin/main -- Casks/ssh-drop.rb; then
            if ! git diff --quiet -- Casks/ssh-drop.rb; then
              git commit --message "$message" -- Casks/ssh-drop.rb
              git push origin "HEAD:refs/heads/${branch}"
            fi

            if [[ -z "$(gh pr list --repo "$tap" --head "$branch" --state open --json number --jq '.[].number')" ]]; then
              gh pr create --repo "$tap" --base main --head "$branch" \
                --title "$message" --body "Automated ssh-drop release cask update."
            fi
          fi
